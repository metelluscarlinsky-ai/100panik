<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>100PANIK - Media</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --card-bg: #0a0a0a;
    --border: #222;
    --text: #fff;
    --text-muted: #888;
    --cyan: #00f0ff;
    --orange: #ff7f00; /* Koulè Zoranj pou Like a */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

  /* TOP NAVIGATION TABS */
  .top-nav {
    position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
    background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: center; gap: 20px;
    padding: 15px;
  }
  .nav-btn {
    background: none; border: none; color: var(--text-muted);
    font-size: 16px; font-weight: 600; cursor: pointer; padding-bottom: 5px;
    transition: color 0.2s;
  }
  .nav-btn.active { color: var(--text); border-bottom: 2px solid var(--cyan); }

  /* KONTENÈ JENERAL */
  .view-container {
    height: 100vh; width: 100%; display: none;
    padding-top: 60px;
  }
  .view-container.active { display: block; }

  /* =========================================
     1. REELS VIEW (TIKTOK STYLE - VIDEYO SÈLMAN)
  ========================================= */
  #reels-view { overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
  #reels-view::-webkit-scrollbar { display: none; }
  
  .reel-slide {
    height: calc(100vh - 60px); width: 100%;
    scroll-snap-align: start; position: relative;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  .reel-media { width: 100%; height: 100%; object-fit: cover; }
  
  .reel-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 40%);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 20px;
  }
  .reel-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
  
  .reel-actions {
    position: absolute; right: 15px; bottom: 80px;
    display: flex; flex-direction: column; gap: 20px; align-items: center;
  }
  .action-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%; width: 50px; height: 50px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; cursor: pointer; transition: 0.2s;
  }
  .action-btn svg { width: 22px; height: 22px; }
  
  /* KOULÈ ZORANJ POU LIKE A */
  .action-btn.liked { background: rgba(255, 127, 0, 0.2); border-color: var(--orange); color: var(--orange); }
  .action-btn.liked svg { fill: var(--orange); stroke: var(--orange); }

  /* BOUTON SON AN */
  .sound-btn {
    position: absolute;
    top: 70px; right: 15px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    width: 35px; height: 35px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; cursor: pointer; z-index: 100;
  }
  .sound-btn svg { width: 18px; height: 18px; }

  /* =========================================
     2. FEED VIEW (INSTAGRAM STYLE - FOTO)
  ========================================= */
  #feed-view { overflow-y: auto; padding-bottom: 50px; }
  .feed-content { max-width: 500px; margin: 0 auto; width: 100%; }
  
  .ig-post {
    background: var(--card-bg); border-bottom: 1px solid var(--border);
    margin-bottom: 10px; display: flex; flex-direction: column;
  }
  .ig-header { display: flex; align-items: center; padding: 12px 16px; gap: 10px; }
  .ig-avatar {
    width: 36px; height: 36px; border-radius: 50%; background: #fff;
    display: flex; align-items: center; justify-content: center;
    object-fit: cover; border: 1px solid #333;
  }
  .ig-username { font-weight: 600; font-size: 14px; }
  .ig-media { width: 100%; max-height: 600px; object-fit: cover; display: block; }
  
  .ig-actions { padding: 12px 16px 8px; display: flex; gap: 16px; }
  .ig-btn { background: none; border: none; color: var(--text); cursor: pointer; }
  .ig-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; }
  
  /* KOULÈ ZORANJ POU LIKE FEED LA */
  .ig-btn.liked svg { fill: var(--orange); stroke: var(--orange); }
  
  .ig-likes { padding: 0 16px; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .ig-caption { padding: 0 16px; font-size: 14px; margin-bottom: 8px; }
  .ig-caption span { font-weight: 600; margin-right: 5px; }
  
  .ig-comments-section { padding: 0 16px; margin-bottom: 12px; }
  .ig-comment-item { font-size: 14px; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .ig-comment-item span { font-weight: 600; margin-right: 5px; }
  
  .ig-add-comment { display: flex; padding: 12px 16px; border-top: 1px solid var(--border); gap: 10px; }
  .ig-add-comment input { flex: 1; background: transparent; border: none; color: #fff; outline: none; }
  .ig-add-comment button { background: none; border: none; color: var(--cyan); font-weight: 600; cursor: pointer; }
  .ig-login-prompt { padding: 12px; border-top: 1px solid var(--border); font-size: 14px; color: var(--text-muted); text-align: center; }
  .ig-login-prompt a { color: var(--cyan); text-decoration: none; font-weight: 600; }

  /* MODAL KOMANTÈ POU REELS */
  .modal-comments {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9999;
    display: none; align-items: flex-end;
  }
  .modal-comments.open { display: flex; }
  .modal-content {
    background: #141414; width: 100%; height: 60vh;
    border-radius: 20px 20px 0 0; padding: 20px;
    display: flex; flex-direction: column;
  }
  .modal-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
  .modal-comments-list { flex: 1; overflow-y: auto; }
  .modal-comment-item { margin-bottom: 12px; font-size: 14px; }
  .modal-comment-item span { font-weight: 600; color: var(--cyan); margin-right: 5px; }

  .action-btn.saved { color: #ffd700; border-color: #ffd700; background: rgba(255, 215, 0, 0.1); }
  .ig-btn.saved svg { fill: #ffd700; stroke: #ffd700; }

</style>
</head>
<body>

<div class="top-nav">
  <button class="nav-btn active" onclick="switchView('reels')" id="btn-reels">Reels</button>
  <button class="nav-btn" onclick="switchView('feed')" id="btn-feed">Feed</button>
</div>

<div id="reels-view" class="view-container active"></div>
<div id="feed-view" class="view-container"><div class="feed-content" id="feed-posts"></div></div>

<div class="modal-comments" id="comments-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Comments</h3>
      <button onclick="document.getElementById('comments-modal').classList.remove('open')" style="background:none; border:none; color:#fff; font-size:24px;">&times;</button>
    </div>
    <div class="modal-comments-list" id="modal-comments-list"></div>
    <div class="ig-add-comment" id="modal-comment-form" style="display:none; padding:12px 0 0 0;">
      <input type="text" id="modal-comment-input" placeholder="Add a comment...">
      <button onclick="postReelComment()">Post</button>
    </div>
  </div>
</div>

<script src="/js/customer.js"></script>
<script src="/js/app.js?v=1795803148"></script>
<script>
  let loggedInUser = null;
  let allAds = [];

  let brandAvatar = '/images/new-hero.jpg';
  fetch('/api/public-settings').then(r => r.json()).then(s => {
    if (s.brand_avatar) brandAvatar = s.brand_avatar;
  });

  let currentReelAdId = null;

  // Verifye koneksyon an dirèkteman pou l pa janm fè erè
  const savedToken = localStorage.getItem('panik_customer_token');
  const savedCustomer = localStorage.getItem('panik_customer_data');
  if (savedToken && savedCustomer) {
    try { loggedInUser = JSON.parse(savedCustomer); } catch(e) {}
  }

  
  // FONKSYON POU ARCHIVE (SAVE)
  function isSaved(url) {
    let archive = JSON.parse(localStorage.getItem('panik_archive') || '[]');
    return archive.includes(url);
  }

  function toggleArchive(btn, url) {
    let archive = JSON.parse(localStorage.getItem('panik_archive') || '[]');
    const index = archive.indexOf(url);
    
    if (index > -1) {
      // Retire l
      archive.splice(index, 1);
      btn.classList.remove('saved');
      alert('Removed from your archive.');
    } else {
      // Sove l
      archive.push(url);
      btn.classList.add('saved');
      alert('Saved to your archive!');
    }
    localStorage.setItem('panik_archive', JSON.stringify(archive));
  }

  function switchView(view, scrollToId) {
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(view + '-view').classList.add('active');
    document.getElementById('btn-' + view).classList.add('active');
    
    if (view === 'reels') {
      // Si w klike sou yon videyo nan feed la, w ap rive sou li
      if (scrollToId) {
        const target = document.getElementById('reel-' + scrollToId);
        if (target) target.scrollIntoView({ behavior: 'instant' });
      }

      // Jwe videyo ki nan ekran an
      setTimeout(() => {
        document.querySelectorAll('.reel-media').forEach(v => {
          if (v.tagName === 'VIDEO' && v.getBoundingClientRect().top >= 0 && v.getBoundingClientRect().bottom <= window.innerHeight) {
            v.play().catch(()=>{});
          }
        });
      }, 100);
      
    } else {
      // Pause videyo lè w ale sou Feed la
      document.querySelectorAll('.reel-media').forEach(v => { if (v.tagName === 'VIDEO') v.pause(); });
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const res = await fetch('/api/ads');
      allAds = await res.json();
      const videos = allAds.filter(ad => ad.type === 'video');

      // REELS: Sèlman videyo
      const reelsView = document.getElementById('reels-view');
      if (videos.length > 0) {
        reelsView.innerHTML = videos.map(ad => renderReelSlide(ad)).join('');
      } else {
        reelsView.innerHTML = '<div style="color:#888; text-align:center; padding-top:50px;">No video reels available.</div>';
      }

      // FEED: Tou sa (Foto ak Videyo)
      const feedView = document.getElementById('feed-posts');
      if (allAds.length > 0) {
        feedView.innerHTML = allAds.map(ad => renderFeedPost(ad)).join('');
        allAds.forEach(ad => loadFeedComments(ad.id));
      } else {
        feedView.innerHTML = '<div style="color:#888; text-align:center; padding-top:50px;">No posts available.</div>';
      }
      setupVideoObserver();
    } catch (e) { console.error(e); }
  });

  // =========================================
  // FONKSYON POU RANN REELS (AK BOUTON SON)
  // =========================================
  function renderReelSlide(ad) {
    return `
      <div class="reel-slide" id="reel-${ad.id}">
        <video src="${ad.media_url}" class="reel-media" loop muted playsinline autoplay></video>
        
        <!-- BOUTON SON AN ISIT LA -->
        <button class="sound-btn" onclick="toggleSound(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        </button>

        <div class="reel-overlay">
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
            <img src="${brandAvatar}" style="width:40px;height:40px;border-radius:50%;border:2px solid #fff; object-fit:cover;">
            <div class="reel-title" style="margin-bottom:0;">100panik</div>
          </div>
          <div class="reel-actions">
            <button class="action-btn ${ad.hasLiked ? 'liked' : ''}" id="reel-like-btn-${ad.id}" onclick="toggleReelLike(${ad.id})">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              <span id="reel-like-count-${ad.id}" style="font-size:11px;">${ad.likes || 0}</span>
            </button>
            <button class="action-btn" onclick="openReelComments(${ad.id})">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </button>
            <button class="action-btn ${isSaved(ad.media_url) ? 'saved' : ''}" id="archive-btn-reel-${ad.id}" onclick="toggleArchive(this, '${ad.media_url}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            </button>
          </div>
        </div>
      </div>
    `;
  }

  // FONKSYON POU JWE SON AN
  function toggleSound(btn) {
    const video = btn.parentElement.querySelector('video');
    if (!video) return;
    if (video.muted) {
      video.muted = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>';
    } else {
      video.muted = true;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';
    }
  }

  async function toggleReelLike(id) {
    const currentToken = localStorage.getItem('panik_customer_token');
    if (!currentToken) { window.location.href = '/login.html?redirect=/ads.html'; return; }
    const token = localStorage.getItem('panik_customer_token');
    try {
      const res = await fetch('/api/ads/' + id + '/like', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
      const data = await res.json();
      if (res.ok && data.success) {
        document.getElementById('reel-like-count-' + id).textContent = data.likes;
        const btn = document.getElementById('reel-like-btn-' + id);
        if (data.liked) btn.classList.add('liked'); else btn.classList.remove('liked');
      }
    } catch (e) {}
  }

  async function openReelComments(id) {
    currentReelAdId = id;
    document.getElementById('comments-modal').classList.add('open');
    document.getElementById('modal-comment-form').style.display = localStorage.getItem('panik_customer_token') ? 'flex' : 'none';
    loadReelComments(id);
  }

  async function loadReelComments(id) {
    const res = await fetch('/api/ads/' + id + '/comments');
    const comments = await res.json();
    const list = document.getElementById('modal-comments-list');
    list.innerHTML = comments.map(c => `<div class="modal-comment-item"><span>${c.user_name}</span> ${c.comment}</div>`).join('') || '<p style="color:#888;">No comments yet.</p>';
  }

  async function postReelComment() {
    const input = document.getElementById('modal-comment-input');
    const text = input.value.trim();
    if (!text) return;
    const token = localStorage.getItem('panik_customer_token');
    try {
      const res = await fetch('/api/ads/' + currentReelAdId + '/comments', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ comment: text })
      });
      if (res.ok) { input.value = ''; loadReelComments(currentReelAdId); }
    } catch (e) {}
  }

  // =========================================
  // FONKSYON POU RANN FEED (FOTO)
  // =========================================
  function renderFeedPost(ad) {
    let form = localStorage.getItem('panik_customer_token') ? 
      `<div class="ig-add-comment">
        <input type="text" placeholder="Add a comment..." id="feed-input-${ad.id}">
        <button onclick="postFeedComment(${ad.id})">Post</button>
      </div>` : 
      `<div class="ig-login-prompt"><a href="/login.html?redirect=/ads.html">Log in</a> to like or comment.</div>`;

    return `
      <div class="ig-post" id="post-${ad.id}">
        <div class="ig-header">
          <img src="${brandAvatar}" class="ig-avatar" alt="100PANIK">
          <div class="ig-username">100panik</div>
        </div>
        <img src="${ad.media_url}" class="ig-media">
        <div class="ig-actions">
          <button class="ig-btn ${ad.hasLiked ? 'liked' : ''}" id="feed-like-btn-${ad.id}" onclick="toggleFeedLike(${ad.id})">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
        </div>
        <div class="ig-likes" id="feed-likes-${ad.id}">${ad.likes || 0} likes</div>
        <div class="ig-caption"><span>100panik</span> ${ad.title || ''}</div>
        <div class="ig-comments-section" id="feed-comments-${ad.id}"></div>
        ${form}
      </div>
    `;
  }

  async function toggleFeedLike(id) {
    const currentToken = localStorage.getItem('panik_customer_token');
    if (!currentToken) { window.location.href = '/login.html?redirect=/ads.html'; return; }
    const token = localStorage.getItem('panik_customer_token');
    try {
      const res = await fetch('/api/ads/' + id + '/like', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
      const data = await res.json();
      if (res.ok && data.success) {
        document.getElementById('feed-likes-' + id).textContent = data.likes + ' likes';
        const btn = document.getElementById('feed-like-btn-' + id);
        if (data.liked) btn.classList.add('liked'); else btn.classList.remove('liked');
      }
    } catch (e) {}
  }

  async function loadFeedComments(id) {
    const res = await fetch('/api/ads/' + id + '/comments');
    const comments = await res.json();
    const container = document.getElementById('feed-comments-' + id);
    container.innerHTML = comments.slice(0, 3).map(c => `<div class="ig-comment-item"><div><span>${c.user_name}</span> ${c.comment}</div></div>`).join('');
  }

  async function postFeedComment(id) {
    const input = document.getElementById('feed-input-' + id);
    const text = input.value.trim();
    if (!text) return;
    const token = localStorage.getItem('panik_customer_token');
    try {
      const res = await fetch('/api/ads/' + id + '/comments', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ comment: text })
      });
      if (res.ok) { input.value = ''; loadFeedComments(id); }
    } catch (e) {}
  }

  // KONTE VIEWS
  function recordView(adId) {
    fetch('/api/ads/' + adId + '/view', { method: 'POST' }).catch(()=>{});
  }

  function setupVideoObserver() {
    const videos = document.querySelectorAll('video.reel-media');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && document.getElementById('reels-view').classList.contains('active')) {
          entry.target.play().catch(()=>{});
          // Konte view si se premye fwa
          if (!entry.target.dataset.viewed) {
            const adId = entry.target.closest('.reel-slide').getAttribute('data-id');
            if (adId) { recordView(adId); entry.target.dataset.viewed = 'true'; }
          }
        } else {
          entry.target.pause();
        }
      });
    }, { threshold: 0.6 });
    videos.forEach(v => observer.observe(v));
  }
</script>
</body>
</html>
