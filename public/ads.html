<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ads - 100PANIK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=1795487252">
<style>
  .ads-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .ad-card { background: #141414; border-radius: 16px; overflow: hidden; border: 1px solid #222; cursor: pointer; transition: 0.3s; }
  .ad-card:hover { transform: translateY(-5px); border-color: #00f0ff; }
  .ad-media { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; }
  
  .ad-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; overflow-y: auto; }
  .ad-modal.open { display: block; }
  .modal-close { position: fixed; top: 20px; right: 20px; color: #fff; font-size: 30px; cursor: pointer; z-index: 10000; background: rgba(255,255,255,0.1); width: 40px; height: 40px; border-radius: 50%; text-align: center; line-height: 40px; }
  
  .modal-content-wrapper { max-width: 800px; margin: 60px auto; padding: 0 20px; }
  .modal-media { width: 100%; border-radius: 12px; background: #000; margin-bottom: 20px; }
  .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .btn-like { background: #222; color: #fff; border: 1px solid #444; padding: 10px 20px; border-radius: 100px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600; transition: 0.2s; }
  .btn-like.liked { background: rgba(0,240,255,0.2); color: #00f0ff; border-color: #00f0ff; cursor: default; opacity: 0.7; }
  
  .comments-section { background: #141414; border-radius: 12px; padding: 20px; border: 1px solid #222; }
  .comments-section h3 { color: #fff; margin-bottom: 15px; font-size: 18px; }
  .comment-item { border-bottom: 1px solid #222; padding: 12px 0; display: flex; justify-content: space-between; align-items: flex-start;}
  .comment-header { display: flex; gap: 10px; align-items: center; margin-bottom: 5px; }
  .comment-name { font-weight: 600; color: #00f0ff; font-size: 14px; }
  .comment-text { color: #ccc; font-size: 14px; }
  .comment-del { background: none; border: none; color: #ff0040; font-size: 18px; cursor: pointer; }
  
  .comment-form { display: flex; gap: 10px; margin-top: 20px; }
  .comment-input { flex: 1; padding: 12px; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; color: #fff; outline: none; }
  .btn-send { background: #00f0ff; color: #000; border: none; padding: 0 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
  .login-prompt { text-align: center; padding: 20px; background: #1a1a1a; border-radius: 8px; margin-top: 20px; border: 1px dashed #333; color: #fff;}
  .login-prompt a { color: #00f0ff; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>
<div id="header-mount"></div>

<main class="section">
  <div class="section-title">
    <div>
      <h1 style="font-size: clamp(2rem, 5vw, 3rem);">Ads</h1>
      <p class="sub">Discover our latest news</p>
    </div>
  </div>
  <div class="ads-container" id="ads-grid"></div>
</main>

<div class="ad-modal" id="ad-modal">
  <div class="modal-close" onclick="closeModal()">&times;</div>
  <div class="modal-content-wrapper">
    <div id="modal-media-container"></div>
    <div class="modal-actions">
      <button class="btn-like" id="like-btn" onclick="likeAd()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span id="like-count">0</span> Likes
      </button>
    </div>
    
    <div class="comments-section">
      <h3>Comments</h3>
      <div id="comments-list"></div>
      
      <div class="comment-form" id="comment-form-box" style="display:none;">
        <input type="text" id="comment-text" class="comment-input" placeholder="Write a comment...">
        <button class="btn-send" onclick="postComment()">Send</button>
      </div>
      
      <div class="login-prompt" id="login-prompt-box" style="display:none;">
        <p>You must be logged in to comment.</p>
        <a href="/login.html?redirect=/ads.html">Click here to login</a>
      </div>
    </div>
  </div>
</div>

<div id="footer-mount"></div>

<script src="/js/customer.js"></script>
<script src="/js/app.js?v=1795489720"></script>
<script>
  let currentAdId = null;
  let loggedInUser = null;

  document.addEventListener('DOMContentLoaded', async () => {
    if (window.CustomerAuth && window.CustomerAuth.isLoggedIn()) {
      loggedInUser = window.CustomerAuth.getCustomer();
    }

    try {
      const res = await fetch('/api/ads');
      const ads = await res.json();
      const grid = document.getElementById('ads-grid');

      if (ads.length === 0) {
        grid.innerHTML = '<p style="text-align:center; color:#888;">No ads available.</p>';
        return;
      }

      grid.innerHTML = ads.map(ad => {
        let media = ad.type === 'video' 
          ? '<video src="' + ad.media_url + '" class="ad-media" muted></video>'
          : '<img src="' + ad.media_url + '" class="ad-media">';
        
        return '<div class="ad-card" onclick="openAdModal(' + ad.id + ')">' + media + '</div>';
      }).join('');
    } catch (e) { console.error(e); }
  });

  async function openAdModal(id) {
    currentAdId = id;
    const token = localStorage.getItem('panik_customer_token');
    const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
    
    const res = await fetch('/api/ads/' + id, { headers });
    const ad = await res.json();
    
    const mediaContainer = document.getElementById('modal-media-container');
    if (ad.type === 'video') {
      mediaContainer.innerHTML = '<video src="' + ad.media_url + '" class="modal-media" controls autoplay playsinline></video>';
    } else {
      mediaContainer.innerHTML = '<img src="' + ad.media_url + '" class="modal-media">';
    }
    
    document.getElementById('like-count').textContent = ad.likes || 0;
    const likeBtn = document.getElementById('like-btn');
    
    if (ad.hasLiked) {
      likeBtn.classList.add('liked');
    } else {
      likeBtn.classList.remove('liked');
    }

    if (token) {
      document.getElementById('comment-form-box').style.display = 'flex';
      document.getElementById('login-prompt-box').style.display = 'none';
    } else {
      document.getElementById('comment-form-box').style.display = 'none';
      document.getElementById('login-prompt-box').style.display = 'block';
    }

    loadComments(id);
    document.getElementById('ad-modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('ad-modal').classList.remove('open');
    document.body.style.overflow = 'auto';
    const video = document.querySelector('#modal-media-container video');
    if (video) video.pause();
  }

  async function likeAd() {
    const token = localStorage.getItem('panik_customer_token');
    if (!token) {
      alert('You must be logged in to like.');
      window.location.href = '/login.html?redirect=/ads.html';
      return;
    }
    try {
      const res = await fetch('/api/ads/' + currentAdId + '/like', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
      const data = await res.json();
      if (res.ok && data.success) {
        document.getElementById('like-count').textContent = data.likes;
        const btn = document.getElementById('like-btn');
        if (data.liked) {
          btn.classList.add('liked');
        } else {
          btn.classList.remove('liked');
        }
      } else { alert(data.error); }
    } catch (e) { console.error(e); }
  }

  async function loadComments(adId) {
    const res = await fetch('/api/ads/' + adId + '/comments');
    const comments = await res.json();
    const list = document.getElementById('comments-list');
    
    if (comments.length === 0) {
      list.innerHTML = '<p style="color:#666; font-size:14px;">No comments yet. Be the first!</p>';
      return;
    }
    
    list.innerHTML = comments.map(c => {
      let delBtn = '';
      if (loggedInUser && c.customer_id === loggedInUser.id) {
        delBtn = '<button class="comment-del" onclick="deleteComment(' + c.id + ')">&times;</button>';
      }
      return '<div class="comment-item" id="comment-' + c.id + '">' +
        '<div><div class="comment-header"><span class="comment-name">' + c.user_name + '</span></div><div class="comment-text">' + c.comment + '</div></div>' + delBtn +
      '</div>';
    }).join('');
  }

  async function postComment() {
    const token = localStorage.getItem('panik_customer_token');
    if (!token) return;
    const textInput = document.getElementById('comment-text');
    const text = textInput.value.trim();
    if (!text) return alert('Please write a comment');

    try {
      const res = await fetch('/api/ads/' + currentAdId + '/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ comment: text })
      });
      if (res.ok) { textInput.value = ''; loadComments(currentAdId); } 
      else { alert((await res.json()).error); }
    } catch (e) { alert('Error sending comment'); }
  }

  async function deleteComment(commentId) {
    if (!confirm('Delete this comment?')) return;
    const token = localStorage.getItem('panik_customer_token');
    try {
      const res = await fetch('/api/ads/comments/' + commentId, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
      if (res.ok) { document.getElementById('comment-' + commentId).remove(); }
      else { alert('Unauthorized'); }
    } catch (e) { console.error(e); }
  }
</script>
</body>
</html>
