<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ads Feed - 100PANIK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --text: #fff;
    --cyan: #00f0ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

  /* KONTENÈ POU SNAP SCROLL LA */
  .reels-container {
    height: 100vh;
    width: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* IE/Edge */
  }
  .reels-container::-webkit-scrollbar { display: none; } /* Chrome/Safari */

  /* CHAK SLIDE (PUB) */
  .reel-slide {
    height: 100vh;
    width: 100%;
    scroll-snap-align: start;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  /* MEDYA A (FOTO OSWA VIDEYO) */
  .reel-media {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Fè l kouvri tout ekran an */
  }

  /* OVERLAY POU TÈKS LA */
  .reel-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 80px 20px 40px;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .reel-info {
    flex: 1;
    padding-right: 20px;
  }
  .reel-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  .reel-desc {
    font-size: 14px;
    color: #ddd;
    line-height: 1.4;
  }

  /* BOUTON YO SOU BÒ DWAT LA (TIKTOK STYLE) */
  .reel-actions {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
  }
  .action-btn {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    width: 55px;
    height: 55px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s;
    color: #fff;
  }
  .action-btn:active { transform: scale(0.9); }
  .action-btn svg { width: 24px; height: 24px; margin-bottom: 2px; }
  .action-btn span { font-size: 11px; font-weight: 600; }
  .action-btn.liked { background: rgba(255, 0, 64, 0.2); border-color: #ff0040; color: #ff0040; }
  .action-btn.liked svg { fill: #ff0040; stroke: #ff0040; }

  /* MODAL KOMANTÈ */
  .comments-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 9999;
    display: none;
    align-items: flex-end;
  }
  .comments-modal.open { display: flex; }
  .comments-content {
    background: #141414;
    width: 100%;
    height: 70vh;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .comments-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #333;
    padding-bottom: 15px;
    margin-bottom: 15px;
  }
  .comments-list {
    flex: 1;
    overflow-y: auto;
    padding-right: 5px;
  }
  .comment-item {
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .comment-text-box { flex: 1; }
  .comment-name { font-weight: 600; font-size: 13px; color: var(--cyan); margin-bottom: 3px; }
  .comment-text { font-size: 14px; color: #ddd; }
  .comment-del { background: none; border: none; color: #ff0040; font-size: 18px; cursor: pointer; }
  .comment-form { display: flex; gap: 10px; margin-top: 15px; }
  .comment-input { flex: 1; padding: 14px; border-radius: 10px; border: 1px solid #333; background: #0a0a0a; color: #fff; outline: none; }
  .comment-send { background: var(--cyan); color: #000; border: none; padding: 0 20px; border-radius: 10px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<!-- KONTENÈ SNAP SCROLL LA -->
<div class="reels-container" id="reels-container">
  <!-- Pub yo ap enjekte isit la pa JS -->
</div>

<!-- MODAL KOMANTÈ -->
<div class="comments-modal" id="comments-modal">
  <div class="comments-content">
    <div class="comments-header">
      <h3 style="font-size: 16px;">Comments</h3>
      <button onclick="closeComments()" style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer;">&times;</button>
    </div>
    <div class="comments-list" id="comments-list"></div>
    <div class="comment-form" id="comment-form-box">
      <input type="text" id="comment-input" class="comment-input" placeholder="Add a comment...">
      <button class="comment-send" onclick="postComment()">Post</button>
    </div>
    <div id="login-prompt" style="display:none; text-align:center; padding:15px; color:#888; font-size:14px;">
      You must <a href="/login.html?redirect=/ads.html" style="color:var(--cyan);">Login</a> to comment.
    </div>
  </div>
</div>

<script src="/js/app.js?v=reels"></script>
<script>
  let currentAdId = null;
  let currentLikes = 0;
  let loggedInUser = null;

  // Verifye koneksyon kliyan an
  if (window.CustomerAuth && window.CustomerAuth.isLoggedIn()) {
    loggedInUser = window.CustomerAuth.getCustomer();
  }

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const res = await fetch('/api/ads');
      let ads = await res.json();
      
      // Si pa gen pub, montre yon mesaj
      if (!Array.isArray(ads) || ads.length === 0) {
        document.getElementById('reels-container').innerHTML = '<div style="display:flex; height:100vh; align-items:center; justify-content:center; color:#888;">No ads available right now.</div>';
        return;
      }

      const container = document.getElementById('reels-container');
      
      // Mélange (shuffle) pub yo pou l pa toujou parèt nan menm lòd la (optional, men li bon pou UX)
      // ads = ads.sort(() => Math.random() - 0.5);

      container.innerHTML = ads.map(ad => {
        let mediaTag = '';
        if (ad.type === 'video') {
          mediaTag = `<video src="${ad.media_url}" class="reel-media" loop muted playsinline autoplay></video>`;
        } else {
          mediaTag = `<img src="${ad.media_url}" class="reel-media" alt="${ad.title}">`;
        }

        return `
          <div class="reel-slide">
            ${mediaTag}
            <div class="reel-overlay">
              <div class="reel-info">
                <div class="reel-title">${ad.title || '100PANIK'}</div>
                <div class="reel-desc">Discover the new collection.</div>
              </div>
              <div class="reel-actions">
                <button class="action-btn ${ad.hasLiked ? 'liked' : ''}" id="like-btn-${ad.id}" onclick="toggleLike(${ad.id})">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                  <span id="like-count-${ad.id}">${ad.likes || 0}</span>
                </button>
                <button class="action-btn" onclick="openComments(${ad.id})">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                  <span>Comments</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Jere videyo ki jwe lè w rive sou yo
      setupVideoObserver();

    } catch (e) { console.error('Error loading ads:', e); }
  });

  // Pause videyo ki pa nan ekran an, jwe sa ki nan ekran an
  function setupVideoObserver() {
    const videos = document.querySelectorAll('.reel-media');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          if (entry.target.tagName === 'VIDEO') entry.target.play().catch(()=>{});
        } else {
          if (entry.target.tagName === 'VIDEO') entry.target.pause();
        }
      });
    }, { threshold: 0.6 });

    videos.forEach(video => observer.observe(video));
  }

  // LIKE FUNCTION
  async function toggleLike(id) {
    const token = localStorage.getItem('panik_customer_token');
    if (!token) {
      alert('You must be logged in to like.');
      window.location.href = '/login.html?redirect=/ads.html';
      return;
    }
    try {
      const res = await fetch('/api/ads/' + id + '/like', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
      const data = await res.json();
      if (res.ok && data.success) {
        document.getElementById('like-count-' + id).textContent = data.likes;
        const btn = document.getElementById('like-btn-' + id);
        if (data.liked) btn.classList.add('liked');
        else btn.classList.remove('liked');
      } else { alert(data.error); }
    } catch (e) { console.error(e); }
  }

  // KOMANTÈ FONKSYON
  async function openComments(id) {
    currentAdId = id;
    document.getElementById('comments-modal').classList.add('open');
    
    // Jere si kliyan an konekte
    if (loggedInUser) {
      document.getElementById('comment-form-box').style.display = 'flex';
      document.getElementById('login-prompt').style.display = 'none';
    } else {
      document.getElementById('comment-form-box').style.display = 'none';
      document.getElementById('login-prompt').style.display = 'block';
    }

    loadComments(id);
  }

  function closeComments() {
    document.getElementById('comments-modal').classList.remove('open');
  }

  async function loadComments(id) {
    const res = await fetch('/api/ads/' + id + '/comments');
    const comments = await res.json();
    const list = document.getElementById('comments-list');
    
    if (!comments.length) {
      list.innerHTML = '<p style="color:#888; text-align:center; margin-top:20px;">No comments yet. Be the first!</p>';
      return;
    }
    
    list.innerHTML = comments.map(c => {
      let delBtn = '';
      if (loggedInUser && c.customer_id === loggedInUser.id) {
        delBtn = `<button class="comment-del" onclick="deleteComment(${c.id})">&times;</button>`;
      }
      return `
        <div class="comment-item" id="comment-${c.id}">
          <div class="comment-text-box">
            <div class="comment-name">${c.user_name}</div>
            <div class="comment-text">${c.comment}</div>
          </div>
          ${delBtn}
        </div>
      `;
    }).join('');
  }

  async function postComment() {
    const token = localStorage.getItem('panik_customer_token');
    if (!token) return;
    
    const input = document.getElementById('comment-input');
    const text = input.value.trim();
    if (!text) return;

    try {
      const res = await fetch('/api/ads/' + currentAdId + '/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ comment: text })
      });
      if (res.ok) {
        input.value = '';
        loadComments(currentAdId);
      } else {
        alert((await res.json()).error);
      }
    } catch (e) { alert('Error sending comment'); }
  }

  async function deleteComment(id) {
    if (!confirm('Delete this comment?')) return;
    const token = localStorage.getItem('panik_customer_token');
    try {
      const res = await fetch('/api/ads/comments/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
      if (res.ok) document.getElementById('comment-' + id).remove();
    } catch (e) { console.error(e); }
  }
</script>
</body>
</html>
