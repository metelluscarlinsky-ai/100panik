<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="100PANIK">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<title>Koleksyon — 100PANIK</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/images/icons/icon-180.png?v=1791991632">
  <link rel="apple-touch-icon" sizes="152x152" href="/images/icons/icon-152.png?v=1791991632">
  <link rel="apple-touch-icon" sizes="167x167" href="/images/icons/icon-167.png?v=1791991632">
</head>
<body>
<div id="header-mount"></div>

<main class="section">
  <div style="margin-bottom:32px;">
    <h1 style="font-size:clamp(2rem,5vw,3.5rem);">Koleksyon</h1>
    <p class="text-muted" id="results-count">Chajman...</p>
  </div>

  <div class="filters">
    <input type="text" id="search-input" class="form-input" placeholder="Chèche yon pyès..." style="max-width:280px;">
    <select id="category-filter" class="form-select" style="max-width:200px;">
      <option value="">Tout Kategori</option>
    </select>
    <select id="sort-filter" class="form-select" style="max-width:200px;">
      <option value="new">Pi Nouvo</option>
      <option value="price-asc">Pri: Ba a Wo</option>
      <option value="price-desc">Pri: Wo a Ba</option>
      <option value="name">Non A-Z</option>
    </select>
    <button class="btn btn-outline btn-sm" id="clear-filters">Retire Filtè</button>
  </div>

  <div class="products-grid" id="products-grid">
    <div class="skeleton" style="aspect-ratio:3/4;"></div>
    <div class="skeleton" style="aspect-ratio:3/4;"></div>
    <div class="skeleton" style="aspect-ratio:3/4;"></div>
    <div class="skeleton" style="aspect-ratio:3/4;"></div>
    <div class="skeleton" style="aspect-ratio:3/4;"></div>
    <div class="skeleton" style="aspect-ratio:3/4;"></div>
  </div>

  <div id="empty-state" class="hidden text-center" style="padding:60px 20px;">
    <h3>Pa gen rezilta</h3>
    <p class="text-muted" style="margin-top:8px;">Eseye chanje filtè yo.</p>
  </div>
</main>

<div id="footer-mount"></div>

<script src="/js/customer.js"></script>
<script src="/js/app.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/pwa.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const { api, productCardHTML } = window.Panik;
  const grid = document.getElementById('products-grid');
  const emptyState = document.getElementById('empty-state');
  const resultsCount = document.getElementById('results-count');
  const searchInput = document.getElementById('search-input');
  const catFilter = document.getElementById('category-filter');
  const sortFilter = document.getElementById('sort-filter');

  const params = new URLSearchParams(location.search);
  const initialCat = params.get('category') || '';
  const initialSearch = params.get('search') || '';
  searchInput.value = initialSearch;

  let allProducts = [];

  // Chaje kategori yo
  try {
    const cats = await api('/api/products/meta/categories');
    cats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      catFilter.appendChild(opt);
    });
    catFilter.value = initialCat;
  } catch (e) {}

  async function loadProducts() {
    grid.innerHTML = `
      <div class="skeleton" style="aspect-ratio:3/4;"></div>
      <div class="skeleton" style="aspect-ratio:3/4;"></div>
      <div class="skeleton" style="aspect-ratio:3/4;"></div>
      <div class="skeleton" style="aspect-ratio:3/4;"></div>
    `;
    try {
      const query = new URLSearchParams();
      if (catFilter.value) query.set('category', catFilter.value);
      if (searchInput.value) query.set('search', searchInput.value);
      allProducts = await api('/api/products?' + query.toString());
      render();
    } catch (e) {
      grid.innerHTML = '<p class="text-muted">Erè chajman.</p>';
    }
  }

  function render() {
    let list = [...allProducts];
    const sort = sortFilter.value;
    if (sort === 'price-asc') list.sort((a, b) => a.price - b.price);
    else if (sort === 'price-desc') list.sort((a, b) => b.price - a.price);
    else if (sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name));

    if (list.length === 0) {
      grid.classList.add('hidden');
      emptyState.classList.remove('hidden');
      resultsCount.textContent = '0 pyès';
      return;
    }
    grid.classList.remove('hidden');
    emptyState.classList.add('hidden');
    resultsCount.textContent = `${list.length} pyès jwenn`;
    grid.innerHTML = list.map(productCardHTML).join('');
  }

  let t;
  searchInput.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(loadProducts, 300);
  });
  catFilter.addEventListener('change', loadProducts);
  sortFilter.addEventListener('change', render);

  document.getElementById('clear-filters').onclick = () => {
    searchInput.value = '';
    catFilter.value = '';
    sortFilter.value = 'new';
    history.replaceState({}, '', '/collection.html');
    loadProducts();
  };

  loadProducts();
});
</script>
<script src="/js/install-pwa.js" defer></script>
</body>
</html>
