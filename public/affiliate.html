<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Affiliate Dashboard - 100PANIK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .aff-login { max-width: 400px; margin: 100px auto; background: #141414; padding: 40px; border-radius: 24px; border: 1px solid #222; }
  .aff-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 30px; }
  .aff-card { background: #141414; padding: 20px; border-radius: 16px; border: 1px solid #222; }
  .aff-card h3 { color: #888; font-size: 13px; margin-bottom: 10px; }
  .aff-card p { color: #00f0ff; font-size: 24px; font-weight: 700; }
  .order-item { background: #141414; padding: 15px; border-radius: 8px; border: 1px solid #222; margin-bottom: 10px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div id="header-mount"></div>

<main class="section">
  <div id="login-view" class="aff-login">
    <h2 style="text-align:center; margin-bottom: 20px;">Affiliate Login</h2>
    <form id="aff-login-form">
      <div class="form-group"><label>Email</label><input type="email" id="aff-email" required></div>
      <div class="form-group"><label>Affiliate Code</label><input type="text" id="aff-code" required></div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
    </form>
  </div>

  <div id="dashboard-view" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
      <h1>Affiliate Dashboard</h1>
      <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>

    <div class="aff-card" style="margin-bottom:30px; text-align:center;">
      <h3>Your Affiliate Link</h3>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <input type="text" id="aff-link" class="form-input" readonly>
        <button class="btn btn-primary" onclick="copyLink()">Copy</button>
      </div>
    </div>

    <div class="aff-stats">
      <div class="aff-card"><h3>Total Sales</h3><p id="stat-sales">0</p></div>
      <div class="aff-card"><h3>Total Earnings</h3><p id="stat-earnings">0 HTG</p></div>
    </div>

    <h3 style="margin-bottom:15px;">Recent Orders</h3>
    <div id="orders-list"></div>
  </div>
</main>

<script src="/js/app.js"></script>
<script>
  let currentAff = null;

  function logout() {
    localStorage.removeItem('affiliate_data');
    window.location.reload();
  }

  function copyLink() {
    const input = document.getElementById('aff-link');
    input.select();
    document.execCommand('copy');
    alert('Link copied!');
  }

  document.getElementById('aff-login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('aff-email').value;
    const code = document.getElementById('aff-code').value;

    fetch('/api/affiliate/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, code })
    })
    .then(res => res.json().then(data => { if (!res.ok) throw new Error(data.error); return data; }))
    .then(data => {
      currentAff = data.affiliate;
      localStorage.setItem('affiliate_data', JSON.stringify(currentAff));
      loadDashboard();
    })
    .catch(err => alert(err.message));
  });

  function loadDashboard() {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('dashboard-view').style.display = 'block';

    const link = window.location.origin + '/?ref=' + currentAff.code;
    document.getElementById('aff-link').value = link;
    document.getElementById('stat-sales').textContent = currentAff.total_sales;
    document.getElementById('stat-earnings').textContent = currentAff.total_earnings + ' HTG';

    fetch('/api/affiliate/' + currentAff.id + '/stats')
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById('orders-list');
        if (data.orders.length === 0) {
          list.innerHTML = '<p style="color:#888;">No orders yet.</p>';
          return;
        }
        list.innerHTML = data.orders.map(o => `
          <div class="order-item">
            <div>
              <strong>${o.order_number}</strong><br>
              <small style="color:#888;">${new Date(o.created_at).toLocaleDateString()}</small>
            </div>
            <div style="color:#00f0ff; font-weight:bold;">${o.total} HTG</div>
          </div>
        `).join('');
      });
  }

  // Chèche si afilye a te deja konekte
  const saved = localStorage.getItem('affiliate_data');
  if (saved) {
    currentAff = JSON.parse(saved);
    loadDashboard();
  }
</script>
</body>
</html>
