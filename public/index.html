<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/images/icons/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<title>100PANIK — Futurist Premium Clothing</title>
</head>
<body>

<div id="header-mount"></div>

<main>
  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <span class="hero-tag">
        <span class="hero-tag-dot"></span>
        NEW COLLECTION 2026
      </span>
      <div class="hero-actions" style="margin-top: 30px;">
        <a href="/collection.html" class="btn btn-primary btn-lg hero-cta">
          <span>Explore Collection</span>
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <a href="/track.html" class="btn btn-outline btn-lg">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          Track Order
        </a>
      </div>
    </div>
  </section>

  <!-- NOUVO RIVE (PWODWI) -->
  <section class="section">
    <div class="section-title">
      <div>
        <h2>New Arrivals</h2>
        <p class="sub">Latest pieces added to the collection</p>
      </div>
      <a href="/collection.html" class="btn btn-outline btn-sm">View All</a>
    </div>
    <div class="products-grid" id="featured-products">
      <p style="color:#888; grid-column:1/-1; text-align:center; padding:20px;">Loading products...</p>
    </div>
  </section>

  <!-- PIBLISITE (PUB) -->
  <section class="section" id="ads-section" style="display:none;">
    <div class="section-title">
      <div>
        <h2>Ads</h2>
        <p class="sub">Discover more</p>
      </div>
    </div>
    <div class="ads-grid" id="ads-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px;"></div>
  </section>
</main>

<div id="footer-mount"></div>

<!-- Script la chaje dènye -->
<script src="/js/customer.js"></script>
<script src="/js/app.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/pwa.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  // 1. PWODWI YO
  try {
    const resP = await fetch('/api/products');
    const products = await resP.json();
    const grid = document.getElementById('featured-products');
    
    if (!Array.isArray(products) || products.length === 0) {
      grid.innerHTML = '<p style="color:#888; grid-column:1/-1; text-align:center; padding:20px;">No products available.</p>';
      return;
    }

    grid.innerHTML = products.slice(0, 4).map(p => {
      // Si pa gen foto, kite background lan nwa (nan CSS la)
      let imgTag = '';
      if (p.images && p.images.length > 0 && p.images[0]) {
        imgTag = '<img src="' + p.images[0] + '" alt="' + p.name + '" onerror="this.style.display=\'none\'">';
      }
      
      return '<a href="/product.html?slug=' + p.slug + '" class="product-card">' +
        '<div class="product-image" style="background:#222; position:relative;">' + imgTag + '</div>' +
        '<div class="product-info">' +
          '<h3 class="product-name">' + p.name + '</h3>' +
          '<div class="product-price"><span class="price-current">' + p.price + ' HTG</span></div>' +
        '</div>' +
      '</a>';
    }).join('');
  } catch (e) { 
    console.error(e);
    document.getElementById('featured-products').innerHTML = '<p style="color:#ff0040; grid-column:1/-1; text-align:center; padding:20px;">Error loading products.</p>';
  }

  // 2. PIBLISITE YO
  try {
    const resA = await fetch('/api/ads');
    const ads = await resA.json();
    const adsSection = document.getElementById('ads-section');
    const adsGrid = document.getElementById('ads-grid');

    if (Array.isArray(ads) && ads.length > 0) {
      adsSection.style.display = 'block';
      adsGrid.innerHTML = ads.map(ad => {
        let media = ad.type === 'video' 
          ? '<video src="' + ad.media_url + '" muted loop autoplay playsinline style="width:100%;height:100%;object-fit:cover;display:block;"></video>'
          : '<img src="' + ad.media_url + '" style="width:100%;height:100%;object-fit:cover;display:block;">';
        return '<a href="/ads.html" style="display:block; aspect-ratio:16/9; border-radius:16px; overflow:hidden; border:1px solid #333;">' + media + '</a>';
      }).join('');
    }
  } catch (e) { console.error(e); }
});
</script>
</body>
</html>
