<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=1795784313">
<title>100PANIK — Futurist Premium Clothing</title>
<style>
  /* 1. FÒSE FOTO A PLEN EKRAN AN */
  body .hero {
    background-image: linear-gradient(rgba(10,10,10,0.4), rgba(10,10,10,0.7)), url('/images/hero-bg.jpg') !important;
    background-size: cover !important;
    background-position: center center !important;
    background-repeat: no-repeat !important;
    height: 100vh !important;
    height: 100dvh !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding-top: 70px !important;
    padding-bottom: 20px !important;
    margin: 0 !important;
  }
  
  /* 2. BWAT TRANSPARAN POU TÈKS LA */
  body .hero-content {
    background: rgba(10, 10, 10, 0.7) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    padding: 40px 25px !important;
    border-radius: 24px !important;
    border: 1px solid rgba(0, 240, 255, 0.2) !important;
    max-width: 450px !important;
    width: 90% !important;
    text-align: center !important;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5) !important;
  }

  /* 3. ESPAS PUB LA */
  .ads-section {
    padding: 60px 20px;
    max-width: 1200px;
    margin: 0 auto;
    background: #0a0a0a;
  }
  .ads-section h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    margin-bottom: 10px;
    color: #fff;
    border-left: 4px solid #00f0ff;
    padding-left: 15px;
  }
  .ads-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 30px;
  }
  .ad-card {
    display: block;
    aspect-ratio: 16/9;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #333;
    background: #141414;
    position: relative;
    text-decoration: none;
  }
  .ad-card img, .ad-card video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* NOUVO FOTO A */
  body main section.hero {
    background-image: linear-gradient(rgba(10,10,10,0.5), rgba(10,10,10,0.7)), url('/images/new-hero.jpg') !important;
    background-size: cover !important;
    background-position: center center !important;
    background-repeat: no-repeat !important;
  }

</style>
</head>
<body>

<!-- HEADER MOUNT (app.js ap chaje l) -->
<div id="header-mount"></div>

<main>
  <!-- SEKSYON HERO (FOTO PLEN EKRAN) -->
  <section class="hero">
    <div style="background:transparent !important; backdrop-filter:none !important; border:none !important; box-shadow:none !important; padding:0 !important; width:90%; max-width:450px; text-align:center;">
      <span class="hero-tag" style="display:inline-block; padding: 8px 16px; border-radius: 100px; background: rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.3); color: #00f0ff; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; margin-bottom: 30px;">
        100 PANIK BRAND
      </span>
      <div class="hero-actions" style="margin-top: 20px;">
        <a href="/collection.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; border-radius: 12px; background: #00f0ff; color: #000; font-weight: 700; font-size: 16px; text-decoration: none; margin-bottom: 15px;">
          Explore Collection <span>&rarr;</span>
        </a>
        <a href="/track.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; border-radius: 12px; background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.2); font-weight: 600; font-size: 16px; text-decoration: none;">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg> Track Order
        </a>
      </div>
    </div>
  </section>

  <!-- SEKSYON PWODWI (NOUVO RIVE) -->
  <section style="padding: 60px 20px; max-width: 1200px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px;">
      <div>
        <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; margin: 0 0 5px 0; color: #fff;">New Arrivals</h2>
        <p style="color: #888; margin: 0; font-size: 14px;">Latest pieces added to the collection</p>
      </div>
      <a href="/collection.html" style="color: #00f0ff; text-decoration: none; font-size: 14px; font-weight: bold;">View All</a>
    </div>
    
    <div id="featured-products" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px;">
      <p style="color:#888; grid-column:1/-1; text-align:center; padding:20px;">Loading products...</p>
    </div>
  </section>

  <!-- SEKSYON PIBLISITE (TOUJOU VIZIB) -->
  <section class="ads-section" id="ads-section">
    <h2>Ads & Promotions</h2>
    <p style="color: #888; font-size: 14px; margin: 0 0 0 19px;">Discover our latest updates and videos</p>
    <div class="ads-grid" id="ads-grid">
      <p style="color:#888; grid-column:1/-1; text-align:center; padding:20px;">Loading ads...</p>
    </div>
  </section>
</main>

<!-- FOOTER MOUNT (app.js ap chaje l) -->
<div id="footer-mount"></div>

<!-- CHAJE FONKSYON YO -->
<script src="/js/app.js?v=1795692064"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  
  // 1. CHAJE PWODWI YO
  try {
    const resP = await fetch('/api/products');
    const products = await resP.json();
    const grid = document.getElementById('featured-products');
    
    if (!Array.isArray(products) || products.length === 0) {
      grid.innerHTML = '<p style="color:#888; grid-column:1/-1; text-align:center; padding:20px;">No products available yet.</p>';
      return;
    }

    grid.innerHTML = products.slice(0, 4).map(p => {
      let imgTag = '';
      if (p.images && p.images.length > 0 && p.images[0]) {
        imgTag = '<img src="' + p.images[0] + '" alt="' + p.name + '" style="width:100%; height:100%; object-fit:cover;" onerror="this.style.display=\'none\'">';
      } else {
        imgTag = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#555;font-size:12px;">No Image</div>';
      }
      
      return '<a href="/product.html?slug=' + p.slug + '" style="text-decoration:none; color:#fff; display:block;">' +
        '<div style="aspect-ratio:3/4; background:#222; border-radius:12px; overflow:hidden; margin-bottom:15px;">' + imgTag + '</div>' +
        '<h3 style="font-size:16px; margin:0 0 5px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + p.name + '</h3>' +
        '<div style="color:#00f0ff; font-weight:bold;">' + p.price + ' HTG</div>' +
      '</a>';
    }).join('');
  } catch (e) { 
    document.getElementById('featured-products').innerHTML = '<p style="color:#ff0040; grid-column:1/-1; text-align:center; padding:20px;">Error loading products.</p>';
  }

  // 2. CHAJE PIBLISITE YO
  try {
    const resA = await fetch('/api/ads');
    const ads = await resA.json();
    const adsGrid = document.getElementById('ads-grid');
    
    if (Array.isArray(ads) && ads.length > 0) {
      adsGrid.innerHTML = ads.map(ad => {
        let media = ad.type === 'video' 
          ? '<video src="' + ad.media_url + '" muted loop autoplay playsinline></video>'
          : '<img src="' + ad.media_url + '" alt="Promo">';
        return '<a href="/ads.html" class="ad-card">' + media + '</a>';
      }).join('');
    } else {
      // Si pa gen pub nan baz done a, montre yon mesaj
      adsGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; background:#141414; border-radius:16px; border:1px dashed #333; color:#888;">No active ads right now. Check back later!</div>';
    }
  } catch (e) { 
    document.getElementById('ads-grid').innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; background:#141414; border-radius:16px; border:1px dashed #333; color:#ff0040;">Error loading ads.</div>';
  }
});
</script>
</body>
</html>
