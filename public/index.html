<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/images/icons/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<title>100PANIK — Rad Futurist Premium</title>
</head>
<body>

<!-- HEADER DIRÈK (POU L PA JANM DISPARÈT) -->
<header class="header">
  <nav class="nav">
    <a href="/" class="logo" aria-label="100PANIK - Akèy">
      <span class="logo-dot"></span>
      <span class="logo-text">100PANIK</span>
      <span class="logo-badge">HT</span>
    </a>
    <ul class="nav-links">
      <li><a href="/collection.html">Koleksyon</a></li>
      <li><a href="/collection.html?category=hoodie">Hoodies</a></li>
      <li><a href="/collection.html?category=t-shirt">T-shirts</a></li>
      <li><a href="/track.html">Swiv Kòmand</a></li>
    </ul>
    <div class="nav-actions">
      <a href="/account.html" class="icon-btn" id="account-btn" aria-label="Kont Mwen">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </a>
      <button class="icon-btn" id="theme-toggle" aria-label="Chanje tèm"></button>
      <a href="/cart.html" class="icon-btn" aria-label="Panier">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span class="cart-count" style="display:none;">0</span>
      </a>
    </div>
  </nav>
</header>

<main>
  <!-- HERO -->
  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <span class="hero-tag">
        <span class="hero-tag-dot"></span>
        NOUVO KOLEKSYON 2026
      </span>
      <div class="hero-actions" style="margin-top: 40px;">
        <a href="/collection.html" class="btn btn-primary btn-lg hero-cta">
          <span>Eksplore Koleksyon</span>
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <a href="/track.html" class="btn btn-outline btn-lg">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          Swiv Kòmand
        </a>
      </div>
    </div>
  </section>

  <!-- NOUVO RIVE (PWODWI) -->
  <section class="section">
    <div class="section-title">
      <div>
        <h2>Nouvo Rive</h2>
        <p class="sub">Pyès ki fèk ajoute nan koleksyon an</p>
      </div>
      <a href="/collection.html" class="btn btn-outline btn-sm">Wè Tout</a>
    </div>
    <div class="products-grid" id="featured-products">
      <div class="skeleton" style="aspect-ratio:3/4;"></div>
      <div class="skeleton" style="aspect-ratio:3/4;"></div>
    </div>
  </section>

  <!-- PIBLISITE (PUB) -->
  <section class="section" id="ads-section" style="display:none;">
    <div class="section-title">
      <div>
        <h2>Piblisite</h2>
        <p class="sub">Dekouvri pi plis</p>
      </div>
      <a href="/ads.html" class="btn btn-outline btn-sm">Wè Tout</a>
    </div>
    <div class="ads-grid" id="ads-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px;"></div>
  </section>
</main>

<div id="footer-mount"></div>

<script src="/js/customer.js"></script>
<script src="/js/app.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/pwa.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  
  // 1. CHAJE PWODWI YO
  try {
    const resP = await fetch('/api/products');
    const products = await resP.json();
    const grid = document.getElementById('featured-products');
    
    if (products.length > 0) {
      // Sèvi ak fonksyon ki nan app.js lan si li la, sinon fè l manyèlman
      if (window.Panik && window.Panik.productCardHTML) {
        grid.innerHTML = products.slice(0, 4).map(window.Panik.productCardHTML).join('');
      } else {
        // Fallback si app.js pa chaje
        grid.innerHTML = products.slice(0, 4).map(p => `
          <a href="/product.html?slug=${p.slug}" class="product-card">
            <div class="product-image">
              <img src="${p.images[0] || '/images/placeholder.jpg'}" alt="${p.name}">
            </div>
            <div class="product-info">
              <h3 class="product-name">${p.name}</h3>
              <div class="product-price"><span class="price-current">${p.price} HTG</span></div>
            </div>
          </a>
        `).join('');
      }
    }
  } catch (e) {
    console.error('Erè pwodwi:', e);
    document.getElementById('featured-products').innerHTML = '<p class="text-muted">Erè chajman.</p>';
  }

  // 2. CHAJE PIBLISITE YO
  try {
    const resA = await fetch('/api/ads');
    const ads = await resA.json();
    const adsSection = document.getElementById('ads-section');
    const adsGrid = document.getElementById('ads-grid');

    if (ads.length > 0) {
      adsSection.style.display = 'block';
      adsGrid.innerHTML = ads.map(ad => {
        let media = ad.type === 'video' 
          ? '<video src="' + ad.media_url + '" muted loop autoplay playsinline style="width:100%;height:100%;object-fit:cover;display:block;"></video>'
          : '<img src="' + ad.media_url + '" style="width:100%;height:100%;object-fit:cover;display:block;">';
        
        return '<div style="aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid #333;box-shadow:0 10px 30px rgba(0,0,0,0.5);">' + media + '</div>';
      }).join('');
    }
  } catch (e) {
    console.error('Erè ads:', e);
  }
});
</script>
</body>
</html>
