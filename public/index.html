<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=1795487252">
<title>100PANIK — Rad Futurist Premium</title>
<style>
  body .hero { background: linear-gradient(135deg, rgba(10,10,10,0.7), rgba(10,10,10,0.4)), url('/images/hero-bg.jpg') center/cover no-repeat !important; }
  .hero-bg { display: none !important; }
  .product-img { width: 100%; height: 100%; object-fit: cover; display: block; background: #141414; }
  .no-image-box { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #141414; color: #555; font-size: 14px; }
</style>
</head>
<body>

<header class="header">
  <nav class="nav">
    <a href="/" class="logo" aria-label="100PANIK - Home">
      <span class="logo-dot"></span>
      <span class="logo-text">100PANIK</span>
      
    </a>
    <ul class="nav-links">
      <li><a href="/collection.html">Collection</a></li>
      <li><a href="/collection.html?category=hoodie">Hoodies</a></li>
      <li><a href="/collection.html?category=t-shirt">T-shirts</a></li>
      <li><a href="/track.html">Swiv Order</a></li>
    </ul>
    <div class="nav-actions">
      <a href="/account.html" class="icon-btn" id="account-btn" aria-label="My Account">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </a>
      <button class="icon-btn" id="theme-toggle" aria-label="Chanje tèm"></button>
      <a href="/cart.html" class="icon-btn" aria-label="Cart">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-count" style="display:none;">0</span>
      </a>
    </div>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="hero-content">
      <span class="hero-tag">
        <span class="hero-tag-dot"></span>
        NOUVO KOLEKSYON 2026
      </span>
      <div class="hero-actions" style="margin-top: 40px;">
        <a href="/collection.html" class="btn btn-primary btn-lg hero-cta">
          <span>Eksplore Collection</span>
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <a href="/track.html" class="btn btn-outline btn-lg">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          Swiv Order
        </a>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-title">
      <div>
        <h2>New Arrivals</h2>
        <p class="sub">Pyès ki fèk ajoute nan koleksyon an</p>
      </div>
      <a href="/collection.html" class="btn btn-outline btn-sm">View All</a>
    </div>
    <div class="products-grid" id="featured-products">
      <p style="color:#888; grid-column:1/-1; text-align:center; padding: 20px;">Ap chaje...</p>
    </div>
  </section>

  <section class="section" id="ads-section" style="display:none;">
    <div class="section-title">
      <div>
        <h2>Ads</h2>
        <p class="sub">Dekouvri pi plis</p>
      </div>
      <a href="/ads.html" class="btn btn-outline btn-sm">View All</a>
    </div>
    <div class="ads-grid" id="ads-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px;"></div>
  </section>
</main>

<div id="footer-mount"></div>

<script>
// Kòd sa a ap chaje pwodwi yo ak piblisite yo poukont li
document.addEventListener('DOMContentLoaded', function() {
  
  // 1. CHAJE PWODWI
  fetch('/api/products')
    .then(function(res) { return res.json(); })
    .then(function(products) {
      var grid = document.getElementById('featured-products');
      if (!products || products.length === 0) {
        grid.innerHTML = '<p style="color:#ff0040; grid-column:1/-1; text-align:center;">Pa gen okenn pwodwi nan baz done a. Ale nan Admin pou w ajoute youn.</p>';
        return;
      }
      
      var html = '';
      products.slice(0, 4).forEach(function(p) {
        var hasImage = p.images && p.images.length > 0 && p.images[0];
        var imgTag = hasImage 
          ? '<img src="' + p.images[0] + '" class="product-img" onerror="this.parentElement.innerHTML=\'<div class=no-image-box>Erè Photo</div>\'">'
          : '<div class="no-image-box">Pa Gen Photo</div>';
          
        html += '<a href="/product.html?slug=' + p.slug + '" class="product-card">' +
          '<div class="product-image" style="position:relative;">' + imgTag + '</div>' +
          '<div class="product-info">' +
            '<h3 class="product-name">' + p.name + '</h3>' +
            '<div class="product-price"><span class="price-current">' + p.price + ' HTG</span></div>' +
          '</div>' +
        '</a>';
      });
      grid.innerHTML = html;
    })
    .catch(function(err) {
      document.getElementById('featured-products').innerHTML = '<p style="color:#ff0040; grid-column:1/-1; text-align:center;">Erè koneksyon ak API a.</p>';
    });

  // 2. CHAJE PIBLISITE
  fetch('/api/ads')
    .then(function(res) { return res.json(); })
    .then(function(ads) {
      if (ads && ads.length > 0) {
        document.getElementById('ads-section').style.display = 'block';
        var html = '';
        ads.forEach(function(ad) {
          var media = ad.type === 'video' 
            ? '<video src="' + ad.media_url + '" muted autoplay loop style="width:100%;height:100%;object-fit:cover;"></video>'
            : '<img src="' + ad.media_url + '" style="width:100%;height:100%;object-fit:cover;">';
            
          html += '<a href="/ads.html" style="display:block; aspect-ratio:16/9; border-radius:16px; overflow:hidden; border:1px solid #333;">' + media + '</a>';
        });
        document.getElementById('ads-grid').innerHTML = html;
      }
    })
    .catch(function(e) { console.log(e); });
});
</script>

<!-- Script pou Header lan ak lòt bagay yo chaje -->
<script src="/js/app.js?v=1795482735"></script>
<script src="/js/pwa.js" defer></script>
</body>
</html>
