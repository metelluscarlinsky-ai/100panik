<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="100PANIK">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<title>Swiv Kòmand — 100PANIK</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/images/icons/icon-180.png?v=1791991632">
  <link rel="apple-touch-icon" sizes="152x152" href="/images/icons/icon-152.png?v=1791991632">
  <link rel="apple-touch-icon" sizes="167x167" href="/images/icons/icon-167.png?v=1791991632">
</head>
<body>
<div id="header-mount"></div>

<main class="section" style="max-width:800px;">
  <h1 style="margin-bottom:16px;">Swiv Kòmand</h1>
  <p class="text-muted" style="margin-bottom:32px;">Antre nimewo kòmand oswa tracking pou wè estati a.</p>

  <form id="track-form" class="card" style="margin-bottom:32px;">
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <input type="text" id="track-input" class="form-input" placeholder="PANIK-XXXXXXXX oswa TRK..." style="flex:1;min-width:220px;">
      <button type="submit" class="btn btn-primary">Chèche</button>
    </div>
  </form>

  <div id="track-result"></div>
</main>

<div id="footer-mount"></div>

<script src="/js/customer.js"></script>
<script src="/js/app.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/pwa.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const { api, formatPrice, escapeHTML } = window.Panik;
  const result = document.getElementById('track-result');
  const input = document.getElementById('track-input');
  const form = document.getElementById('track-form');

  const STATUS = {
    pending:   { label: 'An Atant',   step: 1 },
    confirmed: { label: 'Konfime',    step: 2 },
    shipped:   { label: 'An Kous',    step: 3 },
    delivered: { label: 'Livre',      step: 4 },
    cancelled: { label: 'Anile',      step: 0 }
  };

  function renderTimeline(status) {
    const current = STATUS[status]?.step || 0;
    const steps = [
      { n: 1, label: 'An Atant',   desc: 'Kòmand resevwa' },
      { n: 2, label: 'Konfime',    desc: 'Peman verifye' },
      { n: 3, label: 'An Kous',    desc: 'Sou wout livrezon' },
      { n: 4, label: 'Livre',      desc: 'Kliyan resevwa' }
    ];
    if (status === 'cancelled') {
      return `<div class="card" style="border-color:var(--danger);text-align:center;padding:32px;">
        <h3 style="color:var(--danger);margin-bottom:8px;">Kòmand Anile</h3>
        <p class="text-muted">Kontakte sipò pou plis enfòmasyon.</p>
      </div>`;
    }
    return `
      <div style="display:flex;justify-content:space-between;margin:40px 0;position:relative;">
        <div style="position:absolute;top:20px;left:12%;right:12%;height:2px;background:var(--border);z-index:0;"></div>
        <div style="position:absolute;top:20px;left:12%;height:2px;background:var(--neon);z-index:0;transition:width 0.6s;width:${((current - 1) / 3) * 76}%;box-shadow:0 0 12px var(--neon);"></div>
        ${steps.map(s => `
          <div style="text-align:center;z-index:1;flex:1;">
            <div style="width:40px;height:40px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
              background:${s.n <= current ? 'var(--neon)' : 'var(--bg-3)'};
              color:${s.n <= current ? '#000' : 'var(--text-3)'};
              box-shadow:${s.n <= current ? '0 0 20px rgba(0,240,255,0.6)' : 'none'};
              border:2px solid ${s.n <= current ? 'var(--neon)' : 'var(--border)'};">
              ${s.n <= current ? '&#10003;' : s.n}
            </div>
            <div style="font-weight:600;font-size:13px;color:${s.n <= current ? 'var(--text)' : 'var(--text-3)'};">${s.label}</div>
            <div class="text-muted" style="font-size:11px;margin-top:2px;">${s.desc}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  async function trackOrder(num) {
    result.innerHTML = '<div class="card" style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto;"></div></div>';
    try {
      const order = await api('/api/orders/track/' + encodeURIComponent(num));
      const status = STATUS[order.status] || STATUS.pending;
      result.innerHTML = `
        <div class="card">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:8px;">
            <div>
              <div class="text-muted" style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;">Nimewo Kòmand</div>
              <div style="font-family:var(--font-display);font-weight:700;font-size:20px;">${escapeHTML(order.order_number)}</div>
            </div>
            <div style="text-align:right;">
              <div class="text-muted" style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;">Estati</div>
              <span class="status status-${order.status}">${status.label}</span>
            </div>
          </div>

          ${renderTimeline(order.status)}

          <div style="border-top:1px solid var(--border);padding-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;">
            <div>
              <div class="text-muted" style="font-size:12px;">Tracking</div>
              <div style="font-weight:600;font-family:monospace;">${escapeHTML(order.tracking)}</div>
            </div>
            <div>
              <div class="text-muted" style="font-size:12px;">Kliyan</div>
              <div style="font-weight:600;">${escapeHTML(order.customer_name)}</div>
            </div>
            <div>
              <div class="text-muted" style="font-size:12px;">Dat</div>
              <div style="font-weight:600;">${new Date(order.created_at).toLocaleDateString('fr-FR')}</div>
            </div>
            <div>
              <div class="text-muted" style="font-size:12px;">Total</div>
              <div style="font-weight:700;color:var(--neon);">${formatPrice(order.total)}</div>
            </div>
          </div>

          <h3 style="margin:24px 0 12px;">Atik yo</h3>
          ${order.items.map(i => `
            <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:center;">
              ${i.image ? `<img src="${i.image}" style="width:56px;height:56px;border-radius:8px;object-fit:cover;">` : ''}
              <div style="flex:1;">
                <div style="font-weight:600;font-size:14px;">${escapeHTML(i.name)}</div>
                <div class="text-muted" style="font-size:12px;">x${i.quantity}${i.size ? ' - Gwosè ' + escapeHTML(i.size) : ''}${i.color ? ' / ' + escapeHTML(i.color) : ''}</div>
              </div>
              <div style="font-weight:600;color:var(--neon);">${formatPrice(i.price * i.quantity)}</div>
            </div>
          `).join('')}
        </div>
      `;
    } catch (e) {
      result.innerHTML = `
        <div class="card text-center" style="padding:60px 20px;">
          <h3>Kòmand pa jwenn</h3>
          <p class="text-muted" style="margin-top:8px;">Verifye nimewo a epi eseye ankò.</p>
        </div>
      `;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = input.value.trim();
    if (v) {
      history.replaceState({}, '', '/track.html?order=' + encodeURIComponent(v));
      trackOrder(v);
    }
  });

  const params = new URLSearchParams(location.search);
  const initial = params.get('order');
  if (initial) {
    input.value = initial;
    trackOrder(initial);
    if (params.get('new') === '1') {
      const saved = sessionStorage.getItem('last_order');
      if (saved) {
        const o = JSON.parse(saved);
        setTimeout(() => window.Panik.toast(`Kòmand ${o.order_number} konfime. Total: ${formatPrice(o.total)}`, 'success'), 500);
        sessionStorage.removeItem('last_order');
      }
    }
  }
});
</script>
<script src="/js/install-pwa.js" defer></script>
</body>
</html>
