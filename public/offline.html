<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline — 100PANIK</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body {
    background: #0a0a0a; color: #fff; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: Inter, sans-serif; margin: 0; padding: 24px;
    text-align: center;
  }
  .box {
    background: rgba(20,20,20,.7); backdrop-filter: blur(20px);
    border: 1px solid rgba(0,240,255,.3); border-radius: 24px;
    padding: 48px 32px; max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,240,255,.15);
  }
  h1 { font-size: 80px; margin: 0; color: #00f0ff; letter-spacing: -4px; }
  h2 { font-size: 22px; margin: 8px 0 16px; }
  p { opacity: .7; font-size: 14px; margin: 0 0 24px; }
  button {
    background: linear-gradient(135deg, #00f0ff, #0080ff);
    color: #000; border: 0; font-weight: 700;
    padding: 14px 32px; border-radius: 12px;
    cursor: pointer; font-size: 14px; font-family: inherit;
  }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="box">
    <h1>100</h1>
    <h2>Ou pa konekte</h2>
    <p>Pa gen pwoblèm. Kontni w te deja vizite yo disponib offline. Rekonekte pou wè nouvo bagay yo.</p>
    <button onclick="location.reload()">Eseye ankò</button>
  </div>
</body>
</html>
