<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - 100PANIK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0a0a; --bg-card: #141414; --border: #222; --text: #fff; --text-muted: #888; --cyan: #00f0ff; --cyan-dark: #0080ff; --sidebar: 240px; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }
  
  #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
  .login-box { background: var(--bg-card); padding: 40px; border-radius: 20px; border: 1px solid var(--border); width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,240,255,0.1); }
  .login-box h1 { margin-bottom: 20px; color: var(--cyan); font-size: 24px; text-align: center; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
  .form-group input { width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid var(--border); border-radius: 8px; color: #fff; outline: none; }
  .form-group input:focus { border-color: var(--cyan); }
  .btn { padding: 12px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-primary { background: linear-gradient(135deg, var(--cyan), var(--cyan-dark)); color: #000; width: 100%; }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--cyan); color: var(--cyan); }
  .btn-danger { background: rgba(255,0,64,0.1); color: #ff0040; border: 1px solid rgba(255,0,64,0.3); }
  .btn-danger:hover { background: #ff0040; color: #fff; }
  .hidden { display: none !important; }

  .sidebar { width: var(--sidebar); background: var(--bg-card); border-right: 1px solid var(--border); padding: 20px; position: fixed; height: 100vh; overflow-y: auto; }
  .logo { font-size: 20px; font-weight: 800; color: var(--cyan); margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
  .logo::before { content: ''; width: 10px; height: 10px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 10px var(--cyan); }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text-muted); text-decoration: none; border-radius: 8px; margin-bottom: 5px; cursor: pointer; transition: 0.2s; font-size: 14px; font-weight: 500; }
  .nav-item:hover, .nav-item.active { background: rgba(0, 240, 255, 0.1); color: var(--cyan); }
  .nav-item svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  
  .main-content { margin-left: var(--sidebar); padding: 30px; flex: 1; width: calc(100% - var(--sidebar)); }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
  .page-title { font-size: 24px; font-weight: 700; }
  
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .stat-card { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
  .stat-title { color: var(--text-muted); font-size: 13px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 28px; font-weight: 700; color: var(--cyan); }

  .table-container { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th, td { padding: 15px 20px; border-bottom: 1px solid var(--border); }
  th { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; background: rgba(0,0,0,0.2); }
  td { font-size: 14px; }
  .table-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
  
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
  .modal.open { display: flex; }
  .modal-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 500px; padding: 25px; max-height: 90vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-header h2 { font-size: 18px; }
  .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .toast { position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 8px; background: #111; border: 1px solid var(--cyan); color: #fff; z-index: 9999; font-size: 14px; transform: translateY(-100px); opacity: 0; transition: 0.3s; }
  .toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>100PANIK Admin</h1>
    <form id="login-form">
      <div class="form-group">
        <label>Imel</label>
        <input type="email" id="login-email" name="username" placeholder="Antre imel ou..." required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Modpas</label>
        <input type="password" id="login-pass" name="password" placeholder="Antre modpas ou..." required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">Konekte</button>
    </form>
  </div>
</div>

<div class="sidebar" id="app-sidebar" style="display:none;">
  <div class="logo">100PANIK</div>
  <div class="nav-item active" data-page="dashboard">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
    Dashboard
  </div>
  <div class="nav-item" data-page="products">
    <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
    Pwodwi
  </div>
  <div class="nav-item" data-page="orders">
    <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
    Kòmand
  </div>
  <div class="nav-item" data-page="customers">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    Kliyan
  </div>
  <div class="nav-item" data-page="ads">
    <svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
    Piblisite
  </div>
</div>

<div class="main-content" id="app-main" style="display:none;">
  <div class="topbar">
    <div class="page-title" id="current-page-title">Dashboard</div>
    <button class="btn btn-danger" onclick="logout()">Dekonekte</button>
  </div>

  <div id="page-dashboard" class="page-content">
    <div class="stats-grid" id="stats-container"></div>
  </div>

  <div id="page-products" class="page-content hidden">
    <div style="margin-bottom:20px; text-align:right;">
      <button class="btn btn-primary" onclick="openProductModal()" style="width:auto;">+ Ajoute Pwodwi</button>
    </div>
    <div class="table-container">
      <table>
        <thead><tr><th>Imaj</th><th>Non</th><th>Pri</th><th>Estati</th><th>Aksyon</th></tr></thead>
        <tbody id="products-body"></tbody>
      </table>
    </div>
  </div>

  <div id="page-orders" class="page-content hidden">
    <div class="table-container">
      <table>
        <thead><tr><th>Nimewo</th><th>Kliyan</th><th>Total</th><th>Estati</th><th>Aksyon</th></tr></thead>
        <tbody id="orders-body"></tbody>
      </table>
    </div>
  </div>

  <div id="page-customers" class="page-content hidden">
    <div class="table-container">
      <table>
        <thead><tr><th>Non</th><th>Imel</th><th>Telefòn</th><th>Dat</th></tr></thead>
        <tbody id="customers-body"></tbody>
      </table>
    </div>
  </div>

  <div id="page-ads" class="page-content hidden">
    <div style="margin-bottom:20px; text-align:right;">
      <button class="btn btn-primary" onclick="openAdModal()" style="width:auto;">+ Ajoute Piblisite</button>
    </div>
    <div class="table-container">
      <table>
        <thead><tr><th>Imaj/Video</th><th>Tit</th><th>Estati</th><th>Aksyon</th></tr></thead>
        <tbody id="ads-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal" id="modal-product">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Pwodwi</h2>
      <button class="close-btn" onclick="document.getElementById('modal-product').classList.remove('open')">&times;</button>
    </div>
    <form id="form-product" onsubmit="saveProduct(event)">
      <input type="hidden" id="prod-id">
      <div class="form-group"><label>Non</label><input type="text" id="prod-name" required></div>
      <div class="form-row">
        <div class="form-group"><label>Pri (HTG)</label><input type="number" id="prod-price" required></div>
        <div class="form-group"><label>Kategori</label><input type="text" id="prod-cat" placeholder="eg: hoodie"></div>
      </div>
      <div class="form-group"><label>Deskripsyon</label><input type="text" id="prod-desc"></div>
      <div class="form-group"><label>Foto</label><input type="file" id="prod-file" accept="image/*" onchange="uploadFile(this, 'prod-image-url')"></div>
      <input type="hidden" id="prod-image-url">
      <button type="submit" class="btn btn-primary" style="margin-top:10px;">Anrejistre</button>
    </form>
  </div>
</div>

<div class="modal" id="modal-ad">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Piblisite</h2>
      <button class="close-btn" onclick="document.getElementById('modal-ad').classList.remove('open')">&times;</button>
    </div>
    <form id="form-ad" onsubmit="saveAd(event)">
      <div class="form-group"><label>Tit</label><input type="text" id="ad-title"></div>
      <div class="form-group">
        <label>Tip Media</label>
        <select id="ad-type" style="width:100%; padding:12px; background:#0a0a0a; border:1px solid #222; color:#fff; border-radius:8px;">
          <option value="image">Imaj</option>
          <option value="video">Video (MP4)</option>
        </select>
      </div>
      <div class="form-group"><label>Fichye</label><input type="file" id="ad-file" accept="image/*,video/mp4" onchange="uploadFile(this, 'ad-media-url')"></div>
      <input type="hidden" id="ad-media-url">
      <button type="submit" class="btn btn-primary" style="margin-top:10px;">Anrejistre</button>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/js/admin.js"></script>
</body>
</html>
