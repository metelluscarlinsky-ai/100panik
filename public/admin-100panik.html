<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - 100PANIK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0a0a; --bg-card: #141414; --border: #222; --text: #fff; --text-muted: #888; --cyan: #00f0ff; --cyan-dark: #0080ff; --sidebar: 240px; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
  
  #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
  .login-box { background: var(--bg-card); padding: 30px; border-radius: 20px; border: 1px solid var(--border); width: 100%; max-width: 400px; }
  .login-box h1 { margin-bottom: 20px; color: var(--cyan); font-size: 24px; text-align: center; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
  .form-group input, .form-group select { width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid var(--border); border-radius: 8px; color: #fff; outline: none; }
  .form-group input:focus { border-color: var(--cyan); }
  .btn { padding: 12px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
  .btn-primary { background: linear-gradient(135deg, var(--cyan), var(--cyan-dark)); color: #000; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); width: auto; }
  .btn-danger { background: rgba(255,0,64,0.1); color: #ff0040; border: 1px solid rgba(255,0,64,0.3); width: auto; padding: 8px 12px; font-size: 12px; }
  .hidden { display: none !important; }

  .sidebar { width: var(--sidebar); background: var(--bg-card); border-right: 1px solid var(--border); padding: 20px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .logo { font-size: 20px; font-weight: 800; color: var(--cyan); margin-bottom: 30px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text-muted); border-radius: 8px; margin-bottom: 5px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .nav-item:hover, .nav-item.active { background: rgba(0, 240, 255, 0.1); color: var(--cyan); }
  
  .main-content { flex: 1; padding: 30px; overflow-x: hidden; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; gap: 10px; }
  .page-title { font-size: 24px; font-weight: 700; }
  
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .stat-card { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
  .stat-title { color: var(--text-muted); font-size: 13px; margin-bottom: 8px; }
  .stat-value { font-size: 24px; font-weight: 700; color: var(--cyan); }

  .table-container { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; text-align: left; min-width: 500px; }
  th, td { padding: 15px 20px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
  .table-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
  
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal.open { display: flex; }
  .modal-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 500px; padding: 25px; max-height: 90vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .toast { position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 8px; background: #111; border: 1px solid var(--cyan); color: #fff; z-index: 9999; font-size: 14px; transform: translateY(-100px); opacity: 0; transition: 0.3s; }
  .toast.show { transform: translateY(0); opacity: 1; }

  .settings-card { background: var(--bg-card); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; max-width: 700px; }
  .settings-card h3 { margin-bottom: 20px; color: var(--cyan); font-size: 18px; }

  @media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; padding: 15px; border-right: none; border-bottom: 1px solid var(--border); }
    .logo { margin-bottom: 15px; text-align: center; }
    .sidebar nav { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .nav-item { white-space: nowrap; margin-bottom: 0; padding: 8px 15px; }
    .main-content { padding: 15px; }
    .topbar { flex-direction: column; align-items: flex-start; }
    .form-row { grid-template-columns: 1fr; gap: 0; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>100PANIK Admin</h1>
    <form id="login-form">
      <div class="form-group">
        <label>Imel</label>
        <input type="email" id="login-email" name="username" required>
      </div>
      <div class="form-group">
        <label>Modpas</label>
        <input type="password" id="login-pass" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary">Konekte</button>
    </form>
  </div>
</div>

<div class="sidebar" id="app-sidebar" style="display:none;">
  <div class="logo">100PANIK</div>
  <nav>
    <div class="nav-item active" data-page="dashboard">Dashboard</div>
    <div class="nav-item" data-page="products">Pwodwi</div>
    <div class="nav-item" data-page="orders">Kòmand</div>
    <div class="nav-item" data-page="customers">Kliyan</div>
    <div class="nav-item" data-page="ads">Piblisite</div>
    <div class="nav-item" data-page="settings">Konfigirasyon</div>
  </nav>
</div>

<div class="main-content" id="app-main" style="display:none;">
  <div class="topbar">
    <div class="page-title" id="current-page-title">Dashboard</div>
    <button class="btn btn-danger" onclick="logout()">Dekonekte</button>
  </div>

  <div id="page-dashboard" class="page-content">
    <div class="stats-grid" id="stats-container"></div>
  </div>

  <div id="page-products" class="page-content hidden">
    <div style="margin-bottom:20px;"><button class="btn btn-primary" onclick="openProductModal()">+ Ajoute Pwodwi</button></div>
    <div class="table-container">
      <table>
        <thead><tr><th>Imaj</th><th>Non</th><th>Pri</th><th>Aksyon</th></tr></thead>
        <tbody id="products-body"></tbody>
      </table>
    </div>
  </div>

  <div id="page-orders" class="page-content hidden">
    <div class="table-container">
      <table>
        <thead><tr><th>Nimewo</th><th>Kliyan</th><th>Total</th><th>Aksyon</th></tr></thead>
        <tbody id="orders-body"></tbody>
      </table>
    </div>
  </div>

  <div id="page-customers" class="page-content hidden">
    <div class="table-container">
      <table>
        <thead><tr><th>Non</th><th>Imel</th><th>Telefòn</th><th>Dat</th></tr></thead>
        <tbody id="customers-body"></tbody>
      </table>
    </div>
  </div>

  <div id="page-ads" class="page-content hidden">
    <div style="margin-bottom:20px;"><button class="btn btn-primary" onclick="openAdModal()">+ Ajoute Piblisite</button></div>
    <div class="table-container">
      <table>
        <thead><tr><th>Media</th><th>Tit</th><th>Aksyon</th></tr></thead>
        <tbody id="ads-body"></tbody>
      </table>
    </div>
  </div>

  <div id="page-settings" class="page-content hidden">
    <div class="settings-card">
      <h3>Enfòmasyon Mak & Koulè</h3>
      <form id="settings-form" onsubmit="saveSettings(event)">
        <div class="form-row">
          <div class="form-group"><label>Non Mak</label><input type="text" id="set-brand"></div>
          <div class="form-group"><label>Koulè Prensipal (Hex)</label><input type="text" id="set-color" placeholder="#00f0ff"></div>
        </div>
        <div class="form-group"><label>Imel Kontak</label><input type="email" id="set-email"></div>
        <div class="form-group"><label>Telefòn</label><input type="text" id="set-phone"></div>
        <div class="form-group"><label>Enstagram (Lyen)</label><input type="text" id="set-instagram"></div>
        <div class="form-group"><label>Facebook (Lyen)</label><input type="text" id="set-facebook"></div>
        <div class="form-group"><label>TikTok (Lyen)</label><input type="text" id="set-tiktok"></div>
        <button type="submit" class="btn btn-primary" style="margin-top:10px;">Sove Konfigirasyon</button>
      </form>
    </div>

    <div class="settings-card">
      <h3>Chanje Modpas Admin</h3>
      <form id="pass-form" onsubmit="changePassword(event)">
        <div class="form-group"><label>Modpas Aktyèl</label><input type="password" id="pass-current" required></div>
        <div class="form-group"><label>Nouvo Modpas</label><input type="password" id="pass-new" required minlength="6"></div>
        <button type="submit" class="btn btn-primary" style="margin-top:10px;">Chanje Modpas</button>
      </form>
    </div>
  </div>
</div>

<div class="modal" id="modal-product">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Pwodwi</h2>
      <button class="close-btn" onclick="document.getElementById('modal-product').classList.remove('open')">x</button>
    </div>
    <form id="form-product" onsubmit="saveProduct(event)">
      <input type="hidden" id="prod-id">
      <div class="form-group"><label>Non</label><input type="text" id="prod-name" required></div>
      <div class="form-row">
        <div class="form-group"><label>Pri (HTG)</label><input type="number" id="prod-price" required></div>
        <div class="form-group"><label>Kategori</label><input type="text" id="prod-cat" placeholder="eg: hoodie"></div>
      </div>
      <div class="form-group"><label>Deskripsyon</label><input type="text" id="prod-desc"></div>
      <div class="form-group"><label>Foto</label><input type="file" id="prod-file" accept="image/*" onchange="uploadFile(this, 'prod-image-url')"></div>
      <input type="hidden" id="prod-image-url">
      <button type="submit" class="btn btn-primary" style="margin-top:10px;">Anrejistre</button>
    </form>
  </div>
</div>

<div class="modal" id="modal-ad">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Piblisite</h2>
      <button class="close-btn" onclick="document.getElementById('modal-ad').classList.remove('open')">x</button>
    </div>
    <form id="form-ad" onsubmit="saveAd(event)">
      <div class="form-group"><label>Tit</label><input type="text" id="ad-title"></div>
      <div class="form-group">
        <label>Tip Media</label>
        <select id="ad-type">
          <option value="image">Imaj</option>
          <option value="video">Video (MP4)</option>
        </select>
      </div>
      <div class="form-group"><label>Fichye</label><input type="file" id="ad-file" accept="image/*,video/mp4" onchange="uploadFile(this, 'ad-media-url')"></div>
      <input type="hidden" id="ad-media-url">
      <button type="submit" class="btn btn-primary" style="margin-top:10px;">Anrejistre</button>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/js/admin.js"></script>
</body>
</html>
