<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="100PANIK">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/images/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<title>Pwodwi — 100PANIK</title>
</head>
<body>
<div id="header-mount"></div>

<main class="section">
  <div id="product-container">
    <div class="skeleton" style="height:600px;border-radius:24px;"></div>
  </div>

  <section style="margin-top:80px;">
    <h2 style="margin-bottom:32px;">Ou Ka Renmen Tou</h2>
    <div class="products-grid" id="related-products"></div>
  </section>
</main>

<div id="footer-mount"></div>

<script src="/js/customer.js"></script>
<script src="/js/app.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/pwa.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const { api, formatPrice, escapeHTML } = window.Panik;
  const { addToCart } = window.PanikCart;

  const params = new URLSearchParams(location.search);
  const slug = params.get('slug') || params.get('id');
  const container = document.getElementById('product-container');

  if (!slug) {
    container.innerHTML = '<p>Pwodwi pa jwenn.</p>';
    return;
  }

  let product;
  try {
    product = await api('/api/products/' + encodeURIComponent(slug));
    document.title = product.name + ' — 100PANIK';
  } catch (e) {
    container.innerHTML = '<div class="card text-center" style="padding:60px 20px;"><h3>Pwodwi pa jwenn</h3><a href="/collection.html" class="btn btn-primary" style="margin-top:16px;">Retounen Koleksyon</a></div>';
    return;
  }

  const images = product.images.length > 0 ? product.images : ['/images/placeholder.jpg'];
  const onSale = product.compare_price > product.price;

  container.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:48px;" id="product-layout">
      <div>
        <div style="border-radius:24px;overflow:hidden;background:var(--bg-2);border:1px solid var(--border);aspect-ratio:3/4;">
          <img id="main-image" src="${images[0]}" alt="${escapeHTML(product.name)}" style="width:100%;height:100%;object-fit:cover;">
        </div>
        ${images.length > 1 ? `
          <div style="display:flex;gap:12px;margin-top:16px;overflow-x:auto;">
            ${images.map((img, i) => `
              <div class="thumb" data-img="${img}" style="width:80px;height:80px;border-radius:12px;overflow:hidden;border:2px solid ${i === 0 ? 'var(--neon)' : 'var(--border)'};cursor:pointer;flex-shrink:0;">
                <img src="${img}" alt="" style="width:100%;height:100%;object-fit:cover;">
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
      <div style="padding-top:20px;">
        <div class="text-muted" style="font-size:12px;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px;">${escapeHTML(product.category)}</div>
        <h1 style="font-size:clamp(1.75rem,3.5vw,2.75rem);margin-bottom:20px;">${escapeHTML(product.name)}</h1>

        <div style="display:flex;align-items:baseline;gap:16px;margin-bottom:24px;">
          <span style="font-size:32px;font-weight:700;color:var(--neon);">${formatPrice(product.price)}</span>
          ${onSale ? `<span style="font-size:18px;color:var(--text-3);text-decoration:line-through;">${formatPrice(product.compare_price)}</span>` : ''}
        </div>

        <p style="color:var(--text-2);line-height:1.7;margin-bottom:32px;">${escapeHTML(product.description) || 'Pyès kalite siperyè, fèt ak atansyon pou konfò maksimòm.'}</p>

        ${product.sizes.length > 0 ? `
          <div style="margin-bottom:24px;">
            <label class="form-label">Gwosè</label>
            <div style="display:flex;gap:10px;flex-wrap:wrap;" id="size-picker">
              ${product.sizes.map((s, i) => `<button class="size-btn filter-chip ${i === 0 ? 'active' : ''}" data-size="${escapeHTML(s)}">${escapeHTML(s)}</button>`).join('')}
            </div>
          </div>
        ` : ''}

        ${product.colors.length > 0 ? `
          <div style="margin-bottom:24px;">
            <label class="form-label">Koulè</label>
            <div style="display:flex;gap:10px;flex-wrap:wrap;" id="color-picker">
              ${product.colors.map((c, i) => `<button class="color-btn filter-chip ${i === 0 ? 'active' : ''}" data-color="${escapeHTML(c)}">${escapeHTML(c)}</button>`).join('')}
            </div>
          </div>
        ` : ''}

        <div style="display:flex;gap:12px;align-items:center;margin-bottom:24px;">
          <div class="qty-selector">
            <button id="qty-minus">-</button>
            <span id="qty-value">1</span>
            <button id="qty-plus">+</button>
          </div>
          <span class="text-muted" style="font-size:13px;">${product.stock} disponib</span>
        </div>

        <button class="btn btn-primary btn-lg btn-full" id="add-btn" ${product.stock < 1 ? 'disabled' : ''}>
          ${product.stock < 1 ? 'Fini Stock' : 'Ajoute nan Panier'}
        </button>

        <div style="margin-top:32px;padding-top:24px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;gap:12px;align-items:center;font-size:13px;color:var(--text-2);">
            <svg width="18" height="18" fill="none" stroke="var(--neon)" stroke-width="2" viewBox="0 0 24 24"><path d="M5 8h14M5 8a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/></svg>
            Livrezon 1-5 jou nan tout Ayiti
          </div>
          <div style="display:flex;gap:12px;align-items:center;font-size:13px;color:var(--text-2);">
            <svg width="18" height="18" fill="none" stroke="var(--neon)" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Peman sou livrezon disponib
          </div>
          <div style="display:flex;gap:12px;align-items:center;font-size:13px;color:var(--text-2);">
            <svg width="18" height="18" fill="none" stroke="var(--neon)" stroke-width="2" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
            Retou 7 jou garanti
          </div>
        </div>
      </div>
    </div>
  `;

  // Responsive kolòn sou mobil
  if (window.innerWidth < 900) {
    const layout = document.getElementById('product-layout');
    layout.style.gridTemplateColumns = '1fr';
    layout.style.gap = '24px';
  }
  window.addEventListener('resize', () => {
    const layout = document.getElementById('product-layout');
    if (!layout) return;
    layout.style.gridTemplateColumns = window.innerWidth < 900 ? '1fr' : '1fr 1fr';
  });

  // Galri
  document.querySelectorAll('.thumb').forEach(t => {
    t.onclick = () => {
      document.getElementById('main-image').src = t.dataset.img;
      document.querySelectorAll('.thumb').forEach(x => x.style.borderColor = 'var(--border)');
      t.style.borderColor = 'var(--neon)';
    };
  });

  // Seleksyon gwosè/koulè
  let selectedSize = product.sizes[0] || null;
  let selectedColor = product.colors[0] || null;

  document.querySelectorAll('.size-btn').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.size-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      selectedSize = b.dataset.size;
    };
  });
  document.querySelectorAll('.color-btn').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.color-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      selectedColor = b.dataset.color;
    };
  });

  // Kantite
  let qty = 1;
  const qtyEl = document.getElementById('qty-value');
  document.getElementById('qty-plus').onclick = () => {
    if (qty < product.stock) { qty++; qtyEl.textContent = qty; }
  };
  document.getElementById('qty-minus').onclick = () => {
    if (qty > 1) { qty--; qtyEl.textContent = qty; }
  };

  // Ajoute nan panier
  document.getElementById('add-btn').onclick = () => {
    if (product.stock < 1) return;
    addToCart(product, qty, selectedSize, selectedColor);
  };

  // Pwodwi ki gen rapò
  try {
    const related = await api('/api/products?category=' + encodeURIComponent(product.category));
    const filtered = related.filter(p => p.id !== product.id).slice(0, 4);
    document.getElementById('related-products').innerHTML = filtered.length > 0
      ? filtered.map(window.Panik.productCardHTML).join('')
      : '<p class="text-muted">Pa gen lòt pwodwi nan kategori sa a.</p>';
  } catch (e) {}
});
</script>
</body>
</html>
