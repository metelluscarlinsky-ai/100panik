<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="100PANIK">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/images/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<title>Panier — 100PANIK</title>
</head>
<body>
<div id="header-mount"></div>

<main class="section">
  <h1 style="margin-bottom:32px;">Panier</h1>

  <div style="display:grid;grid-template-columns:1fr 380px;gap:32px;" id="cart-layout">
    <div id="cart-content"></div>
    <div id="cart-summary" style="display:none;"></div>
  </div>
</main>

<div id="footer-mount"></div>

<script src="/js/customer.js"></script>
<script src="/js/app.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/pwa.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  function adjustLayout() {
    const layout = document.getElementById('cart-layout');
    if (!layout) return;
    layout.style.gridTemplateColumns = window.innerWidth < 900 ? '1fr' : '1fr 380px';
  }
  adjustLayout();
  window.addEventListener('resize', adjustLayout);
});
</script>
<script src="/js/install-pwa.js" defer></script>
</body>
</html>
